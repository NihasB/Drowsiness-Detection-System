<!-- templates/index.html -->
{% extends "layout.html" %}
{% block content %}
<div id="controls">
  <label>EAR threshold: <span id="ear-threshold">0.20</span></label>
  <label>Consecutive frames to alert: <span id="consec-frames">15</span></label>
</div>

<div id="video-wrap">
  <img src="{{ url_for('video_feed') }}" id="video-stream" alt="Video stream" />
</div>

<div id="info">
  <p>EAR: <span id="ear">-</span></p>
  <p>Drowsy (EAR-rule): <span id="drowsy-rule">false</span></p>
  <p>Drowsy (model): <span id="drowsy-model">n/a</span></p>
</div>

<!-- audio will be generated with WebAudio on drowsy -->
<script>
let audioCtx = null;
let isPlaying = false;
function startBeep() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (isPlaying) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(520, audioCtx.currentTime);
  o.connect(g);
  g.connect(audioCtx.destination);
  g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 0.01);
  o.start();
  // store on window so we can stop
  window._drowsyOsc = {o, g};
  isPlaying = true;
}

function stopBeep() {
  if (!window._drowsyOsc) return;
  const {o, g} = window._drowsyOsc;
  try {
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
    o.stop(audioCtx.currentTime + 0.25);
  } catch(e){}
  window._drowsyOsc = null;
  isPlaying = false;
}

async function pollStatus(){
  try {
    const res = await fetch('/status');
    const data = await res.json();
    document.getElementById('ear').textContent = data.ear ? data.ear.toFixed(3) : "-";
    document.getElementById('drowsy-rule').textContent = data.drowsy ? "true" : "false";
    if (typeof data.drowsy_prob_model !== 'undefined') {
      document.getElementById('drowsy-model').textContent = data.drowsy_prob_model.toFixed(2) + " (prob)";
    }
    if (data.drowsy) {
      startBeep();
    } else {
      stopBeep();
    }
  } catch (e) {
    console.error(e);
  } finally {
    setTimeout(pollStatus, 200); // poll 5x/sec
  }
}

pollStatus();
</script>
{% endblock %}
